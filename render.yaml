services:
  - type: web
    name: oraculum-api
    runtime: python
    plan: free
    numInstances: 1
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT --workers 1
    healthCheckPath: /api/health
    buildFilter:
      paths:
        - app.py
        - requirements.txt
        - .python-version
        - render.yaml
    envVars:
      - key: NVIDIA_API_KEY
        sync: false
      - key: FRONTEND_ORIGINS
        sync: false
